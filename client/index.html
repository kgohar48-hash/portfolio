<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />

    <!-- set the theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pf_theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <title>Gohar Khan Awan — Software Engineer & AI Systems Builder</title>
    <meta
      name="description"
      content="Gohar Khan Awan builds scalable, intelligent systems that turn raw data into decisions. Backend performance, data pipelines, LLM + RAG systems. Products used by 10,000+ people."
    />
    <link rel="canonical" href="https://goharawan.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gohar Khan Awan — Software Engineer & AI Systems Builder" />
    <meta property="og:description" content="Scalable backends, data pipelines, and LLM + RAG systems. Products used by 10,000+ people." />
    <meta property="og:url" content="https://goharawan.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (see client/public/fonts + styles/fonts.css) —
         no third-party font CDN, so no visitor IP leaves for one. -->

    <link rel="preload" href="/fonts/geist-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  </body>
</html>
