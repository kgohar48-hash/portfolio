# Render Blueprint — deploys the API and the static client from this one repo.
# Render dashboard → New → Blueprint → select this repo → Apply.
# Docs: https://render.com/docs/blueprint-spec
#
# Before applying:
#   1. Push this repo to GitHub (or GitLab/Bitbucket) and connect it to Render.
#   2. Create a free MongoDB Atlas cluster and grab its connection string —
#      you'll be prompted to paste it in as MONGO_URI (it's marked `sync: false`
#      below, so it's never stored in this file or the repo).
#   3. Decide the API's public hostname. VITE_API_BASE below assumes
#      api.goharawan.com — after the API service is created, add that
#      custom domain to it in the Render dashboard (Settings → Custom Domains)
#      and point DNS at it. If you'd rather use the *.onrender.com URL Render
#      assigns instead of a custom subdomain, update VITE_API_BASE to match
#      before the client's first build.

services:
  # Backend — Node/Express + MongoDB. Free plan: sleeps after ~15 min idle,
  # then takes 30-50s to wake on the next request. The client is built to
  # tolerate that (see client/src/App.jsx) by falling back to bundled
  # content instead of blocking on a cold API.
  - type: web
    name: gohar-portfolio-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Germany; change if you'd prefer another
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://goharawan.com,https://www.goharawan.com
      # Absolute origin of this API service — used to build the CV tracking-link
      # redirects (api.goharawan.com/r/<slug>/<target>) that go into generated CVs.
      - key: API_PUBLIC_ORIGIN
        value: https://api.goharawan.com
      - key: MONGO_URI
        sync: false # set in the Render dashboard — never committed to the repo
      - key: ADMIN_PASSWORD
        sync: false # the password for the /admin analytics dashboard — set in the dashboard
      - key: ADMIN_JWT_SECRET
        generateValue: true # Render generates a random secret; admin logins survive restarts

      # LLM for the /admin Inbox tab (paste an email → classify → update the
      # job tracker). Free key from aistudio.google.com.
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # Frontend — static React build served from Render's CDN. Static sites are
  # free with no sleep/cold-start behavior.
  - type: web
    name: gohar-portfolio-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://api.goharawan.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
